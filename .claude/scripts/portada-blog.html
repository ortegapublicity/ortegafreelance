<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada del blog</title>
<!--
  Plantilla de portada de la bitácora (1680×945). Estilo tomado del arte del
  post de NEXO LAB (13-10-2026): escena navy con la ruta del proceso en código
  a la izquierda y panel turquesa con el título a la derecha.

  La rellena .claude/scripts/portada-blog.mjs:
    portada-blog.html?lang=es#<JSON codificado>
  JSON: { title: {es, en}, steps: [{icon, es, en}], chips: [{step, text}],
          stepWord: {es, en} }
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0a1e3f; --navy2: #14346b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1680px; height: 945px; overflow: hidden; background: #000; }
  .art { display: flex; width: 1680px; height: 945px; }
  .scene { width: 1008px; height: 945px; position: relative;
    background: radial-gradient(ellipse at 30% 40%, #1b4a8f 0%, var(--navy2) 38%, var(--navy) 100%); }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Lo fijo de todas las portadas: turquesa #00b0a2, el isotipo de Ortega
     Freelance en mosaico muy tenue y el título en blanco. */
  .panel { width: 672px; height: 945px; position: relative; background: #00b0a2;
    display: flex; align-items: center; padding: 0 64px; }
  .panel .mosaic { position: absolute; inset: 0; background: #ffffff; opacity: .09;
    /* __ISOTIPO__ lo sustituye portada-blog.mjs por el favicon en data URI:
       Chrome no acepta una imagen local (file://) como máscara. */
    -webkit-mask-image: url("__ISOTIPO__"); mask-image: url("__ISOTIPO__");
    -webkit-mask-size: 30px 30px; mask-size: 30px 30px; -webkit-mask-repeat: space; mask-repeat: space; }
  .panel h1 { position: relative; width: 100%; min-width: 0; text-wrap: balance; font-family: "Exo 2", sans-serif; font-weight: 700;
    font-size: 66px; line-height: 1.16; letter-spacing: .2px; color: #effffc;
    text-shadow: 0 2px 0 rgba(10, 60, 56, .18); }
  .lbl { font-family: "Poppins", sans-serif; font-weight: 600; letter-spacing: 2.5px; }
</style>
</head>
<body>
<div class="art">
  <div class="scene">
    <svg id="s" viewBox="0 0 1008 945" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="panel">
    <div class="mosaic"></div>
    <h1 id="title"></h1>
  </div>
</div>

<script>
const LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "es";
const DATA = JSON.parse(decodeURIComponent(location.hash.slice(1) || "%7B%7D"));
document.documentElement.lang = LANG;

const pick = (v) => (v && typeof v === "object" ? v[LANG] ?? v.es : v) ?? "";
const title = pick(DATA.title);
const steps = (DATA.steps || []).slice(0, 5);
const stepWord = pick(DATA.stepWord) || (LANG === "en" ? "STEP" : "PASO");

// Título: se encoge hasta caber en el panel.
const h1 = document.getElementById("title");
h1.textContent = title;

// RNG determinista: la misma portada sale idéntica cada vez.
function rng(seed){return function(){seed|=0;seed=seed+0x6d2b79f5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let seed = 11; for (const ch of String(pick(DATA.title) || "")) seed = (seed * 31 + ch.charCodeAt(0)) | 0;
const r = rng(seed);
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("s");
const add = (tag, attrs, parent = svg, text) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; parent.appendChild(e); return e; };

// Escena: la ilustración propia del post (DATA.svg, dibujada por Claude
// según el tema y ya saneada por portada-blog.mjs). Si no la hay, se pinta
// la ruta de nodos de respaldo.
if (DATA.svg) {
  svg.innerHTML = DATA.svg;
} else {
const defs = add("defs", {});
const glow = add("filter", { id: "glow", x: "-50%", y: "-50%", width: "200%", height: "200%" }, defs);
add("feGaussianBlur", { stdDeviation: 6, result: "b" }, glow);
const m = add("feMerge", {}, glow); add("feMergeNode", { in: "b" }, m); add("feMergeNode", { in: "SourceGraphic" }, m);
const grad = add("linearGradient", { id: "path", x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
add("stop", { offset: 0, "stop-color": "#3a7bff" }, grad); add("stop", { offset: .55, "stop-color": "#7b2cbf" }, grad); add("stop", { offset: 1, "stop-color": "#ff6b35" }, grad);

// 1) Red de fondo
const bg = [];
for (let i = 0; i < 70; i++) bg.push([r() * 1008, r() * 945]);
bg.forEach((a, i) => bg.forEach((b, j) => { if (j > i && Math.hypot(a[0]-b[0], a[1]-b[1]) < 150)
  add("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "#5f8fd6", "stroke-opacity": .16, "stroke-width": 1.2 }); }));
bg.forEach(([x, y]) => add("circle", { cx: x, cy: y, r: 2 + r() * 2.4, fill: "#8fb6ff", "fill-opacity": .35 }));

// 2) Esfera de partículas, arriba a la derecha
const cx = 770, cy = 205, R = 140, pts = [];
for (let i = 0; i < 110; i++) { const a = r() * Math.PI * 2, b = Math.acos(2 * r() - 1);
  const x = Math.sin(b) * Math.cos(a), y = Math.sin(b) * Math.sin(a), z = Math.cos(b);
  pts.push({ x: cx + x * R, y: cy + y * R * .92, z }); }
pts.forEach((p, i) => pts.forEach((q, j) => { if (j > i && Math.hypot(p.x-q.x, p.y-q.y) < 60)
  add("line", { x1: p.x, y1: p.y, x2: q.x, y2: q.y, stroke: "#7b9cff", "stroke-opacity": .28 + (p.z + q.z) * .12, "stroke-width": 1.2 }); }));
pts.forEach(p => { const hot = r() > .86;
  add("circle", { cx: p.x, cy: p.y, r: hot ? 5 : 2.6 + (p.z + 1) * 1.2, fill: hot ? "#ff6b35" : "#a9c4ff",
    "fill-opacity": hot ? 1 : .55 + (p.z + 1) * .2, filter: hot ? "url(#glow)" : "" }); });
add("ellipse", { cx, cy, rx: R + 26, ry: (R + 26) * .34, fill: "none", stroke: "#ffd60a", "stroke-opacity": .55, "stroke-width": 1.6, transform: `rotate(-18 ${cx} ${cy})` });

// 3) Iconos (trazo blanco, centrados en 0,0, caben en ~70 px)
const W = { fill: "none", stroke: "#fff", "stroke-width": 4, "stroke-linecap": "round", "stroke-linejoin": "round" };
const ICONS = {
  anuncio: g => { add("rect", { x: -34, y: -26, width: 68, height: 52, rx: 9, ...W }, g);
    add("path", { d: "M -16 6 L -16 -6 L 6 -14 L 6 14 Z", fill: "#fff" }, g);
    add("rect", { x: 12, y: -8, width: 14, height: 5, rx: 2.5, fill: "#fff" }, g); add("rect", { x: 12, y: 3, width: 10, height: 5, rx: 2.5, fill: "#fff" }, g); },
  pagina: g => { add("rect", { x: -30, y: -34, width: 60, height: 68, rx: 8, ...W }, g);
    add("rect", { x: -18, y: -20, width: 36, height: 16, rx: 3, fill: "#fff" }, g);
    [4, 14, 24].forEach((y, i) => add("rect", { x: -18, y, width: i === 2 ? 22 : 36, height: 5, rx: 2.5, fill: "#fff", "fill-opacity": .85 }, g)); },
  pago: g => { add("rect", { x: -38, y: -26, width: 76, height: 52, rx: 9, ...W }, g);
    add("rect", { x: -38, y: -12, width: 76, height: 11, fill: "#fff" }, g);
    add("rect", { x: -28, y: 10, width: 24, height: 6, rx: 3, fill: "#fff" }, g); },
  descarga: g => { add("path", { d: "M 0 -30 L 0 10 M -18 -8 L 0 12 L 18 -8", ...W, "stroke-width": 6 }, g);
    add("path", { d: "M -30 24 L 30 24", ...W, "stroke-width": 6 }, g); },
  correo: g => { add("rect", { x: -36, y: -24, width: 72, height: 48, rx: 7, ...W }, g);
    add("path", { d: "M -34 -20 L 0 6 L 34 -20", ...W }, g); },
  calendario: g => { add("rect", { x: -32, y: -26, width: 64, height: 58, rx: 8, ...W }, g);
    add("rect", { x: -32, y: -26, width: 64, height: 14, rx: 6, fill: "#fff" }, g);
    add("path", { d: "M -16 -34 L -16 -20 M 16 -34 L 16 -20", ...W }, g);
    add("path", { d: "M -14 12 L -4 22 L 16 0", ...W, "stroke-width": 5 }, g); },
  grafico: g => { add("path", { d: "M -34 30 L 34 30", ...W }, g);
    [[-26, 10], [-8, -6], [10, -18], [28, -32]].forEach(([x, top]) => add("rect", { x: x - 6, y: top, width: 12, height: 30 - top - 4, rx: 3, fill: "#fff" }, g)); },
  codigo: g => { add("path", { d: "M -14 -20 L -34 0 L -14 20 M 14 -20 L 34 0 L 14 20 M 6 -28 L -6 28", ...W, "stroke-width": 5 }, g); },
  movil: g => { add("rect", { x: -20, y: -36, width: 40, height: 72, rx: 8, ...W }, g);
    add("circle", { cx: 0, cy: 25, r: 4, fill: "#fff" }, g); add("path", { d: "M -8 -27 L 8 -27", ...W }, g); },
  rayo: g => { add("path", { d: "M 6 -36 L -20 6 L 0 6 L -6 36 L 20 -6 L 0 -6 Z", fill: "#fff" }, g); },
  escudo: g => { add("path", { d: "M 0 -34 L 28 -22 L 28 2 C 28 18 16 30 0 36 C -16 30 -28 18 -28 2 L -28 -22 Z", ...W }, g);
    add("path", { d: "M -12 0 L -2 10 L 14 -8", ...W, "stroke-width": 5 }, g); },
  archivo: g => { add("rect", { x: -34, y: -28, width: 68, height: 16, rx: 4, ...W }, g);
    add("path", { d: "M -28 -12 L -28 28 L 28 28 L 28 -12", ...W }, g); add("path", { d: "M -10 4 L 10 4", ...W }, g); },
  usuario: g => { add("circle", { cx: 0, cy: -12, r: 14, ...W }, g);
    add("path", { d: "M -28 30 C -26 10 -14 4 0 4 C 14 4 26 10 28 30", ...W }, g); },
  buscar: g => { add("circle", { cx: -6, cy: -6, r: 20, ...W, "stroke-width": 5 }, g); add("path", { d: "M 9 9 L 28 28", ...W, "stroke-width": 6 }, g); },
  carrito: g => { add("path", { d: "M -36 -24 L -24 -24 L -14 14 L 24 14 L 32 -12 L -20 -12", ...W }, g);
    add("circle", { cx: -10, cy: 26, r: 5, fill: "#fff" }, g); add("circle", { cx: 20, cy: 26, r: 5, fill: "#fff" }, g); },
  editar: g => { add("path", { d: "M -24 24 L -20 6 L 14 -28 L 28 -14 L -6 20 Z", ...W }, g);
    add("path", { d: "M 6 -20 L 20 -6", ...W }, g); add("path", { d: "M -30 32 L 30 32", ...W }, g); },
  check: g => { add("circle", { r: 30, ...W }, g); add("path", { d: "M -14 0 L -4 10 L 16 -10", ...W, "stroke-width": 6 }, g); },
};

// 4) Ruta: curva descendente con 3–5 nodos
const n = Math.max(1, steps.length);
const xs = Array.from({ length: n }, (_, i) => (n === 1 ? 500 : 150 + (700 * i) / (n - 1)));
const ys = Array.from({ length: n }, (_, i) => (n === 1 ? 520 : 330 + (405 * Math.pow(i / (n - 1), .85))));
const N = xs.map((x, i) => [x, ys[i]]);
const nodeR = n >= 5 ? 48 : 58;
if (n > 1) {
  let d = `M ${N[0][0]} ${N[0][1]}`;
  for (let i = 1; i < n; i++) { const [x0, y0] = N[i - 1], [x1, y1] = N[i], mx = (x0 + x1) / 2;
    d += ` C ${mx} ${y0}, ${mx} ${y1}, ${x1} ${y1}`; }
  add("path", { d, fill: "none", stroke: "url(#path)", "stroke-width": 16, "stroke-linecap": "round", "stroke-opacity": .22, filter: "url(#glow)" });
  add("path", { d, fill: "none", stroke: "url(#path)", "stroke-width": 7, "stroke-linecap": "round", "stroke-dasharray": "1 15" });
  add("path", { d, fill: "none", stroke: "url(#path)", "stroke-width": 3, "stroke-linecap": "round", "stroke-opacity": .9 });
}

const colors = ["#3a7bff", "#7b2cbf", "#ff6b35", "#26d1c4", "#e0457b"];
const lblSize = n >= 5 ? 17 : 21;
N.forEach(([x, y], i) => {
  const st = steps[i] || {};
  const g = add("g", { transform: `translate(${x} ${y})` });
  const col = colors[i % colors.length];
  add("circle", { r: nodeR + 16, fill: col, "fill-opacity": .16 }, g);
  add("circle", { r: nodeR, fill: col, filter: "url(#glow)" }, g);
  add("circle", { r: nodeR, fill: "none", stroke: "#fff", "stroke-opacity": .55, "stroke-width": 2 }, g);
  const ig = add("g", { transform: `scale(${nodeR / 58})` }, g);
  (ICONS[st.icon] || ICONS.check)(ig);
  add("circle", { cx: nodeR * .8, cy: -nodeR * .8, r: 21, fill: "#ffd60a" }, g);
  add("text", { x: nodeR * .8, y: -nodeR * .8 + 8, "text-anchor": "middle", "font-family": "Exo 2", "font-weight": 700, "font-size": 26, fill: "#0a1e3f" }, g, String(i + 1));
  add("text", { x: 0, y: nodeR + 50, "text-anchor": "middle", class: "lbl", "font-size": lblSize, fill: "#ffffff" }, g, String(pick(st)).toUpperCase());
  add("text", { x: 0, y: nodeR + 76, "text-anchor": "middle", class: "lbl", "font-size": 15, fill: "#8fb6ff" }, g, `${stepWord} ${i + 1}`.toUpperCase());
});

// 5) Chips de tecnología sobre los nodos
(DATA.chips || []).slice(0, 3).forEach(({ step, text }) => {
  const p = N[Math.min(Math.max(0, (step | 0) - 1), n - 1)]; if (!p || !text) return;
  const txt = String(text).toUpperCase(), w = txt.length * 14 + 34;
  const g = add("g", { transform: `translate(${p[0]} ${p[1] - nodeR - 44})` });
  add("rect", { x: -w / 2, y: -20, width: w, height: 40, rx: 20, fill: "#0a1e3f", "fill-opacity": .85, stroke: "#26d1c4", "stroke-width": 2.5 }, g);
  add("text", { x: 0, y: 7, "text-anchor": "middle", class: "lbl", "font-size": 19, fill: "#fff" }, g, txt);
});

// 6) Marca de código al fondo
add("text", { x: 40, y: 150, "font-family": "monospace", "font-weight": 700, "font-size": 120, fill: "#8fb6ff", "fill-opacity": .13 }, svg, "</>");

} // fin de la escena de respaldo

// Ajuste del título al panel cuando las fuentes ya cargaron
document.fonts.ready.then(() => {
  let size = 66;
  // Encoge si se pasa de alto o si una palabra larga (un dominio, por ejemplo)
  // no cabe a lo ancho.
  const tooBig = () => h1.scrollHeight > 945 - 140 || h1.scrollWidth > h1.clientWidth + 1;
  while (tooBig() && size > 38) { size -= 2; h1.style.fontSize = size + "px"; }
  if (tooBig()) h1.style.overflowWrap = "anywhere";
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
