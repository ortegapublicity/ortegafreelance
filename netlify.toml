[build]
  publish = "dist"
  # Cada deploy de producción cuesta 15 créditos. Si un commit solo cambia
  # documentación o configuración de agentes (.claude/, *.md, contenido-blog/),
  # Netlify cancela la build: «git diff --quiet» sale con 0 cuando no hay más
  # cambios. Ojo: la web en vivo no cambia con esos commits, a propósito.
  # Sin build anterior con la que comparar, construye siempre.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).claude' ':(exclude)contenido-blog' ':(exclude)*.md'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Contentful servido desde nuestro propio dominio: Safari (navegación privada,
# bloqueadores) puede cortar las peticiones a dominios de terceros ("Load failed").
# Deben ir antes de la regla del SPA: Netlify aplica la primera que coincide.
[[redirects]]
  from = "/cf-api/*"
  to = "https://cdn.contentful.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cf-preview/*"
  to = "https://preview.contentful.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cf-img/*"
  to = "https://images.ctfassets.net/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
